services:
  cube:
    image: cubejs/cube:latest
    ports:
      - "4000:4000"
    environment:
      CUBEJS_DB_TYPE: snowflake
      CUBEJS_DB_SNOWFLAKE_ACCOUNT: ${CUBEJS_DB_SNOWFLAKE_ACCOUNT:?set in .env}
      CUBEJS_DB_SNOWFLAKE_WAREHOUSE: ${CUBEJS_DB_SNOWFLAKE_WAREHOUSE:?set in .env}
      CUBEJS_DB_SNOWFLAKE_ROLE: ${CUBEJS_DB_SNOWFLAKE_ROLE:?set in .env}
      CUBEJS_DB_NAME: ${CUBEJS_DB_NAME:-ANALYTICS_PROD}
      CUBEJS_DB_USER: ${CUBEJS_DB_USER:?set in .env}
      CUBEJS_DB_PASS: ${CUBEJS_DB_PASS:?set Snowflake PAT in .env}
      CUBEJS_API_SECRET: ${CUBEJS_API_SECRET:?set CUBEJS_API_SECRET in .env}
      CUBEJS_DEV_MODE: ${CUBEJS_DEV_MODE:-true}
    volumes:
      - ./model:/cube/conf/model
      - ./cube.js:/cube/conf/cube.js:ro
